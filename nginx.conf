# ==============================================================================
# Nginx Reverse Proxy Configuration for Easypanel + Cloudflare Proxy
# Domain: master-backend.esil.click
# ==============================================================================
# NOTE: Easypanel handles SSL termination (Let's Encrypt / Cloudflare Origin cert)
# and port 80/443 bindings on the host level.
# This config sits directly inside the container or container internal proxy,
# listening on standard container port 80 or 8080 and forwarding cleanly to
# the Go backend process (127.0.0.1:8080).
# ==============================================================================

# Define upstream Go backend server
upstream go_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name master-backend.esil.click localhost _;

    # Client body and buffer tuning for Telegram Mini App payloads
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts for persistent game WebSocket connections
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # --------------------------------------------------------------------------
    # Cloudflare Real IP Restoration
    # (Extract true client IP forwarded through Cloudflare edge network)
    # --------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --------------------------------------------------------------------------
    # WebSocket endpoint routing (/ws)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;

        # Upgrade headers for WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Host and true IP propagation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # Disable proxy buffering for zero-latency game state streaming
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # HTTP API & Webhook endpoints
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # Gzip compression for JSON API responses
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_types application/json text/plain application/xml;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://go_backend/health;
        access_log off;
    }
}
